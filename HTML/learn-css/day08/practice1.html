<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>부스트스트랩을 활용한 UI 만들기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <section class="bg-white border rounded-4 p-4 p-md-5">
        <div class="row g-4 align-items-center">
          <div class="col-12 col-lg-8">
            <span class="badge text-bg-primary mb-3">모집중</span>
            <h1 class="fw-bold mb-3">Frontend Basic Class</h1>
            <p class="text-secondary mb-4">
              HTML과 CSS의 기본부터 bootstrap을 활용한 반응형 UI 제작까지
            </p>
            <div class="d-flex flex-wrap gap-2">
              <span class="badge rounded-pill text-bg-light px-3 py-2"
                >HTML</span
              >
              <span class="badge rounded-pill text-bg-light px-3 py-2"
                >CSS</span
              >
              <span class="badge rounded-pill text-bg-light px-3 py-2"
                >bootstrap</span
              >
              <span class="badge rounded-pill text-bg-light px-3 py-2"
                >Responsive</span
              >
            </div>
          </div>

          <div class="col-12 col-lg-4">
            <div class="bg-light rounded-4 p-4">
              <div class="d-flex justify-content-between mb-3">
                <small class="text-secondary">교육 기간</small>
                <strong>2026. 09.02 ~ 09.30</strong>
              </div>

              <div class="d-flex justify-content-between mb-4">
                <small class="text-secondary">모집 인원</small>
                <strong>24명</strong>
              </div>

              <a class="btn btn-primary w-100" href="#">수강 신청하기</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
