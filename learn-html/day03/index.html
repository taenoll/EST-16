<!doctype html>
<html lang="ko-KR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form 관련 태그 학습</title>
    </head>
    <body>
        <label for="user-name">이름</label>
        <input type="text" id="user-name" name="userName" />

        <hr />

        <label for="male">남성</label>
        <input type="radio" name="gender" id="male" />

        <label for="female">여성</label>
        <input type="radio" name="gender" id="female" />

        <hr />

        <label for="checkbox">동의합니다</label>
        <input type="checkbox" name="" id="checkbox" />

        <hr />

        <label for="nickname">
            이름 :
            <input type="text" />
        </label>
        <!-- 똑같이 뜨긴함 잘못된 건 아닌데 굳이라는 느낌 -->

        <hr />

        <label for="city">부산</label>
        <input type="text" name="city" id="city" value="냥" />

        <hr />

        <div>
            <label for="checkbox2">동의합니다</label>
            <input type="checkbox" name="" id="checkbox2" checked />
        </div>

        <hr />

        <label for="email">이메일 : </label>
        <small>필수 입력사항입니다!!!!!!!!</small>
        <input
            type="email"
            name="email"
            id="email"
            placeholder="example@example.com"
            required
            disabled
            readonly
        />

        <hr />

        <!-- <button type="button">회원가입</button> -->

        <input type="tell" placeholder="010-1234-5678" />
        <input type="search" placeholder="검색어를 입력하세요." />

        <hr />

        <input type="number" id="age" name="age" min="1" max="100" step="5" />

        <hr />

        <input type="date" name="birthDate" />
        <input type="time" name="meetingTime" />
        <input type="datetime-local" name="reservation" />
        <input type="month" name="startMonth" />
        <input type="week" name="week" />

        <hr />

        <input
            type="color"
            name="themacolor"
            id="thema-color"
            value="#000000"
        />

        <input type="submit" value="가입하기" />
        <input type="reset" value="초기화" />
        <input type="button" value="로그인" />

        <button type="button">로그인</button>
        <button type="submit">제출</button>

        <button type="button">로그인</button>

        <hr />

        <label for="introduction">자기소개</label>
        <textarea
            id="introduction"
            name="introduction"
            rows="5"
            cols="40"
        ></textarea>

        <hr />

        <select name="city" id="city2">
            <option value="seoul">설</option>
            <option value="busan">부~</option>
        </select>

        <hr />

        <fieldset>
            <legend>수강 수준</legend>
            <label>
                <input type="radio" name="level" value="beginner" /> 초급
            </label>
        </fieldset>

        <hr />

        <form>
            <label for="user-name">이름</label>
            <input type="text" id="user-name" name="userName" />

            <button type="submit">가입하기</button>
        </form>

        <form action="/search" method="get">
            <label for="keyword">검색어</label>
            <input type="search" id="keyword" name="q" />
            <button type="submit">검색</button>
        </form>
    </body>
</html>
