<!doctype html>
<html lang="ko-KR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>즐거운 Form 활용 실습 시간</title>
    </head>

    <body>
        <header>
            <div>
                <h1>[놀기 신청] 대신 [스터디 신청]</h1>
                <img
                    src="./assets/Pc_2.png"
                    width="700"
                    alt="계곡에서 함께 빨래를 하는 토끼와 강아지 캐릭터"
                />

                <p>
                    함께 공부하며 성장할 스터디원을 모집합니다. <br />
                    참여를 희망하시는 분은 <br />
                    아래 신청서를 작성해주세요!
                </p>
            </div>
        </header>

        <hr />
        <!-- 원래 hr 잘 안 씀 -->

        <main>
            <form>
                <div>
                    <label for="name">이름 (필수)</label>
                    <input type="text" id="name" name="name" required />
                </div>

                <div>
                    <label for="email">이메일 (필수)</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <!-- 여기부터 4. -->
                <fieldset>
                    <legend>HTML 학습 경험 여부를 선택해주세요.</legend>

                    <div>
                        <input
                            type="radio"
                            id="beginner"
                            name="experience"
                            value="beginner"
                            required
                        />
                        <label for="beginner">처음 배워요</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="experienced"
                            name="experience"
                            value="experienced"
                        />
                        <label for="experienced">배운 경험이 있어요</label>
                    </div>
                </fieldset>

                <div>
                    <input
                        type="checkbox"
                        id="privacy"
                        name="privacy"
                        required
                    />
                    <label for="privacy">
                        개인정보 수집에 동의합니다. (필수)
                    </label>
                    <small
                        >수집 항목에 동의 시 마케팅 자료로 활용될 수
                        있습니다.</small
                    >
                </div>

                <button type="submit">스터디 신청서 제출하기</button>
            </form>
        </main>
    </body>
</html>
