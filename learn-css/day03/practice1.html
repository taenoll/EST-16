<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css 실습 02-profile</title>
    <link rel="stylesheet" href="../reset.css"/>
    <link rel="stylesheet" href="./style/practice1.css" />
  </head>
  <body>
    <main class="profile">
      <header class="profile-header">
        <img
          class="profile-image"
          src="./asstets/imeges/profile.gif"
          alt="컴퓨터 앞에 서 있는 동물의 숲 고양이 캐릭터"
        />
        <h1 class="profile-title">안녕하세요, 이유정입니다.</h1>
        <p class="profile-description">
          웹사이트를 만드는 프론트엔드 개발자입니다.
        </p>
      </header>
      <section class="profile-section">
        <h2>좋아하는 것</h2>
        <ul>
          <li>게임</li>
          <li>그림</li>
          <li>웹 개발</li>
        </ul>
      </section>
      <a class="profile-link" href="https://developer.mozilla.org/ko/"
        >MDN Web Docs 방문하기</a
      >
    </main>
  </body>
</html>
